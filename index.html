<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><meta name="description" content="Clipora — open-source, local-first AI video editor."><link rel="manifest" href="manifest.webmanifest"><title>Clipora — AI Video Editor</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><div id="app"><header class="topbar"><div class="brand"><span class="brand-mark">C</span><strong>Clipora</strong><span class="badge">OPEN SOURCE</span></div><input id="projectName" class="project-name" value="Untitled Project" aria-label="Project name"><div class="top-actions"><button id="undoBtn" class="icon-btn" title="Undo">↶</button><button id="redoBtn" class="icon-btn" title="Redo">↷</button><button id="saveBtn" class="ghost-btn">Save</button><button id="exportBtn" class="primary-btn">Export</button></div></header><main class="workspace"><aside class="sidebar"><button class="tool active" data-panel="media"><span>▣</span>Media</button><button class="tool" data-panel="audio"><span>♫</span>Audio</button><button class="tool" data-panel="text"><span>T</span>Text</button><button class="tool" data-panel="captions"><span>CC</span>Captions</button><button class="tool" data-panel="effects"><span>✦</span>Effects</button><button class="tool ai-tool" data-panel="ai"><span>✧</span>AI</button><button class="tool" data-panel="settings"><span>⚙</span>Settings</button></aside><section class="left-panel" id="leftPanel"><div class="panel-head"><h2 id="panelTitle">Media</h2><span id="mediaCount">0</span></div><div id="panelContent" class="panel-content"></div></section><section class="editor"><div class="preview-wrap"><div class="preview-toolbar"><span id="timeLabel">00:00.000</span><span id="resolutionLabel">Preview</span></div><div class="preview-stage" id="previewStage"><video id="preview" playsinline preload="metadata"></video><div id="emptyPreview" class="empty-preview"><div class="play-orb">▶</div><h3>Drop a video to start</h3><p>Your media stays on this device.</p><label class="primary-btn upload-label">Import media<input id="fileInput" type="file" accept="video/*,audio/*,image/*" multiple hidden></label></div></div><div class="transport"><button id="prevBtn">◀◀</button><button id="playBtn" class="play-btn">▶</button><button id="nextBtn">▶▶</button><button id="fitBtn">Fit</button><span id="durationLabel">00:00</span></div></div><section class="timeline-area"><div class="timeline-head"><div class="timeline-actions"><button id="splitBtn">✂ Split</button><button id="deleteBtn">Delete</button><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button></div><span id="status">Ready</span></div><div id="timeline" class="timeline"><div class="ruler" id="ruler"></div><div class="track-row"><div class="track-label">VIDEO</div><div class="track-lane" id="videoTrack"></div></div><div class="track-row"><div class="track-label">AUDIO</div><div class="track-lane empty-lane">Drop audio here</div></div><div class="track-row"><div class="track-label">TEXT</div><div class="track-lane empty-lane">Text overlays</div></div></div></section></section></main><nav class="mobile-tools"><button data-panel="media">Media</button><button data-panel="audio">Audio</button><button data-panel="text">Text</button><button data-panel="captions">CC</button><button data-panel="effects">Effects</button><button class="ai-tool" data-panel="ai">AI</button></nav></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script type="module" src="app.js"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})</script></body></html>
